<!doctype html>
<html lang="en" data-view="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Soulstice — output assembler harness</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/print.css">
  <style>
    body { margin: 0; }
    .harness { max-width: 46rem; margin: 0 auto; padding: 2rem 1.5rem 6rem; }
    .harness h1 { font-family: var(--font-display); color: var(--ink); }
    .harness h2 { font-family: var(--font-display); color: var(--red-text); margin-top: 3rem; }
    .harness pre {
      white-space: pre-wrap; word-wrap: break-word;
      font-family: var(--font-body); font-size: 1rem; line-height: 1.6;
      background: var(--field-bg); border: 1px solid var(--field-border);
      padding: 1rem; color: var(--ink);
    }
    .status { font-family: var(--font-display); font-size: 0.85rem; }
    .ok { color: #1a7f37; } .bad { color: var(--red-text); }
  </style>
</head>
<body>
  <div class="harness">
    <h1>Output assembler harness</h1>
    <p class="status" data-role="summary">running…</p>

    <h2>renderOutputScreen — Compass (live screen)</h2>
    <div id="screen" class="screen"></div>

    <div data-role="dumps"></div>
  </div>

  <script type="module">
    import {
      buildCompass, buildLensVerdict, buildStatement, buildGround,
      buildJournalEntry, buildDriftReview, buildReturn, renderOutputScreen
    } from "./output.js";

    // A canned fixture: some sections have the user's own words (other/text),
    // some are pick-only (so their sections must carry the caveat line), and a
    // few answers contradict each other (Still unresolved must list the pairs).
    const state = {
      mode: "passage", version: 1, arcBreaks: {}, completed: [], cursor: { done: true },
      answers: {
        "stakes-close": { text: "I did not say that part of me has already decided to stop." },
        "field-question": { picks: ["_other"], other: "whether paying attention to a thing is the same as looking after it" },
        "field-repeats": { picks: ["material", "time", "absence"], other: "" },
        "field-defend": { text: "The two from last winter, and the one I still have not titled." },
        "field-fright": { text: "The second one. Nobody asked for it and it is too slight to defend in a statement." },
        "field-embarrass": { picks: ["borrowed"], other: "" },
        "field-theft": { picks: ["withheld"], other: "" },
        "contact-c3": { picks: ["b"], other: "the part of me that checks what people will think just goes quiet" },
        "contact-c2": { picks: ["a"], other: "" },
        "contact-c1b": { picks: ["a"], other: "" },
        "contact-c4": { picks: ["a"], other: "" },
        "epoch-c1": { picks: ["_other"], other: "the sense that whatever I make is already made, by someone or by no one" },
        "epoch-c6": { picks: ["a"], other: "" },
        "epoch-c6b": { picks: ["d"], other: "" },
        "inheritance-c5": { picks: ["a", "c", "e"], other: "" },
        "inheritance-c6": { picks: ["c"], other: "" },
        "voices-c1": { picks: ["b"], other: "" },
        "voices-c2x": { picks: ["a"], other: "" },
        "voices-c3": { picks: ["a"], other: "" },
        "voices-c3a": { picks: ["d"], other: "" },
        "role-c2": { picks: ["d"], other: "" },
        "role-c3": { picks: ["b"], other: "" },
        "prologue-c4": { picks: ["a"], other: "" },
        "fear-c5": { picks: ["d"], other: "" },
        "fear-c3": { picks: ["d"], other: "" },
        "fear-c3d": { picks: ["d"], other: "" },
        "poisons-convert": { picks: ["plain"], other: "" },
        "poisons-sentence": { picks: ["behind"], other: "" },
        "poisons-sentence-true": { picks: ["unchecked"], other: "" },
        "standing-vain": { picks: ["see"], other: "" },
        "standing-secured": { picks: ["less"], other: "" },
        "standing-ignored": { picks: ["reread"], other: "" },
        "standing-2am": { picks: ["mechanical"], other: "" },
        "standing-2am-better": { picks: ["argument"], other: "" },
        "resource-c1": { picks: ["d"], other: "" },
        "field-first": { picks: ["never"], other: "" },
        "stakes-c3": { picks: ["a"], other: "" },
        "stakes-m1": { text: "I make work for people who did not choose to be in the room." },
        "stakes-m2": { text: "My work is always about the moment just before something is understood." },
        "stakes-m3": { text: "My work will never be about proving I was right." },

        // Ground worksheet (exercises buildGround end to end; g4-p2 left blank
        // on purpose to check the "> (left blank)" path).
        "g0-verdict": { text: "Nobody needs any of this and I have been pretending otherwise for years." },
        "g2-against": { picks: ["a", "c"], other: "" },
        "g2-date": { picks: ["b"], other: "" },
        "g2-version": { picks: ["c"], other: "" },
        "g3-action": { picks: ["c"], other: "" },
        "g3-trigger": { picks: ["a"], other: "" },
        "g4-material": { picks: ["b", "c", "e"], other: "" },
        "g4-p1": { text: "What it is: a small piece built only from the part that already landed. Why this one: it is the one thing tonight that proved someone stayed. Smallest version: an afternoon's work, shown to nobody. If it works: it becomes the spine of the next big one." },
        "g4-p2": { text: "" },
        "g4-p3": { text: "The recurring thing I could not name tonight, made once on purpose and given a title." }
      }
    };

    // A standalone Statement run: four of the five section open cards answered
    // in the user's own words, one (st-stakes-open) left empty. The four must
    // produce prose in every length and must NOT appear under Gaps; the empty
    // one MUST appear under Gaps.
    const statementStandalone = {
      mode: "statement", version: 1, arcBreaks: {}, completed: [], cursor: { done: true },
      answers: {
        "st-who-open": { text: "The work is for someone who walked in by accident and now cannot leave the room without carrying something." },
        "st-about-open": { text: "It keeps asking whether looking hard at a small thing is a way of taking care of it or just a way of staring." },
        "st-form-open": { text: "It is built slow, in one material, and I refuse to cut it down to fit a feed. The slowness is the argument." },
        "st-epoch-open": { text: "It comes after the people who made whole careers out of empty rooms, and it refuses to explain itself down to a caption." },
        "st-stakes-open": { text: "" }
      }
    };

    // A Return run with the test, drift and revised reflection cards answered.
    // finishReturn (secondary.js) does the section fills; buildReturn on its own
    // must still leave the three placeholder blocks intact and exact so those
    // string replacements keep matching.
    const returnState = {
      mode: "return", version: 1, arcBreaks: {}, completed: [], cursor: { done: true },
      answers: {
        "ret-d1": { text: "The first direction happened, roughly, but smaller than written." },
        "ret-d2": { text: "The second one never started; the year went elsewhere." },
        "ret-d3": { text: "The third turned into something I did not predict and prefer." }
      }
    };

    const dumps = document.querySelector('[data-role="dumps"]');
    const results = [];

    function check(name, cond) {
      results.push([name, !!cond]);
      const p = document.createElement("p");
      p.className = "status " + (cond ? "ok" : "bad");
      p.textContent = (cond ? "PASS  " : "FAIL  ") + name;
      dumps.appendChild(p);
    }

    function dump(name, run) {
      const h = document.createElement("h2");
      const pre = document.createElement("pre");
      try {
        const out = run();
        h.textContent = name + "  —  " + out.filename;
        pre.textContent = out.markdown;
        results.push([name, true]);
      } catch (e) {
        h.textContent = name + "  —  ERROR";
        pre.textContent = String(e && e.stack || e);
        results.push([name, false]);
      }
      dumps.appendChild(h);
      dumps.appendChild(pre);
    }

    let compass;
    try {
      compass = buildCompass(state);
      renderOutputScreen(compass, document.getElementById("screen"));
      results.push(["renderOutputScreen", true]);
    } catch (e) {
      results.push(["renderOutputScreen", false]);
      document.getElementById("screen").textContent = String(e && e.stack || e);
    }

    dump("buildCompass", () => compass || buildCompass(state));
    dump("buildLensVerdict", () => buildLensVerdict(state));
    dump("buildStatement", () => buildStatement(state));
    dump("buildGround", () => buildGround(state));
    dump("buildJournalEntry", () => buildJournalEntry(state));
    dump("buildDriftReview", () => buildDriftReview([{ date: "2025-01-04" }, { date: "2025-02-11" }, { date: "2025-04-02" }]));
    dump("buildReturn", () => buildReturn({ date: "2025-01-04", markdown: "# Compass: 2025-01-04" }, state));
    dump("buildCompass (empty state)", () => buildCompass({}));
    dump("buildStatement (standalone, 4 of 5 sections)", () => buildStatement(statementStandalone));
    dump("buildReturn (directions only, placeholders intact)", () =>
      buildReturn({ date: "2025-01-04", markdown: "# Compass: 2025-01-04" }, returnState));

    // ---- regression checks for the milestone-7 output fixes ----------------
    // typo() puts nbsp after short words in the section titles it writes, so
    // compare on a space-normalised copy.
    const stmtMd = buildStatement(statementStandalone).markdown;
    const stmtFlat = stmtMd.replace(/ /g, " ");
    check("Statement: answered sections are not listed under Gaps",
      !stmtFlat.includes("Who it is for: left unwritten") &&
      !stmtFlat.includes("What it is about: left unwritten") &&
      !stmtFlat.includes("Form: left unwritten") &&
      !stmtFlat.includes("Where it sits: left unwritten"));
    check("Statement: the one empty section lands under Gaps",
      stmtFlat.includes("## Gaps") && stmtFlat.includes("What is at stake: left unwritten."));
    check("Statement: every length carries the answered prose",
      stmtMd.split("## 400 words")[1].includes("way of taking care of it") &&
      stmtMd.split("## 150 words")[1].includes("way of taking care of it") &&
      stmtMd.split("## 50 words")[1].includes("carrying something"));

    const retMd = buildReturn({ date: "2025-01-04", markdown: "# Compass: 2025-01-04" }, returnState).markdown;
    check("buildReturn: 'What has drifted' placeholder is exact",
      retMd.includes("### What has drifted\n\n> (not recorded)"));
    check("buildReturn: 'Revised directions' placeholder is exact",
      retMd.includes("### Revised directions\n\n> (not recorded)"));
    check("buildReturn: 'one test' placeholder is exact",
      retMd.includes("### What happened to the one test\n\n> (not recorded)"));

    // ---- M10: PDF flow + footnote on every build* -------------------------
    const flat = (s) => String(s).replace(/ /g, " ");
    const FOOT_RE = /\n---\n\nMade with Soulstice, an instrument by Sinaida Krivchenko · sinaida\.eu\s*$/;

    const m10builds = {
      "buildCompass": () => buildCompass(state),
      "buildLensVerdict": () => buildLensVerdict(state),
      "buildStatement": () => buildStatement(state),
      "buildGround": () => buildGround(state),
      "buildJournalEntry": () => buildJournalEntry(state),
      "buildDriftReview": () => buildDriftReview([{ date: "2025-01-04" }, { date: "2025-02-11" }]),
      "buildReturn": () => buildReturn({ date: "2025-01-04", markdown: "# Compass: 2025-01-04" }, state),
      "buildCompass (empty state)": () => buildCompass({}),
      "buildStatement (standalone)": () => buildStatement(statementStandalone)
    };
    for (const name in m10builds) {
      const md = m10builds[name]().markdown;
      check(name + ": ends with the Soulstice footnote block", FOOT_RE.test(flat(md)));
      check(name + ": no .md / data: download affordance in the markdown",
        !md.includes("](data:") && !/\bDownload \.md\b/.test(md));
    }

    // The live output screen (Compass rendered above into #screen).
    const scr = document.getElementById("screen");
    check("renderOutputScreen: Save as PDF button replaces the .md download",
      !!scr.querySelector('[data-role="save-pdf"]') &&
      /save as pdf/i.test(scr.querySelector('[data-role="save-pdf"]').textContent) &&
      !scr.querySelector('[data-role="download"]'));
    check("renderOutputScreen: quiet Copy text button present",
      !!scr.querySelector('[data-role="copy-text"]'));
    check("renderOutputScreen: print-dialog hint present",
      /choose .save as pdf. as the destination/i.test(
        flat((scr.querySelector('[data-role="pdf-hint"]') || {}).textContent || "")));
    check("renderOutputScreen: no .md download / data: affordance in the DOM",
      !scr.querySelector('a[download]') && !/\bdata:/.test(scr.innerHTML) &&
      !/Download \.md/.test(scr.textContent));
    check("renderOutputScreen: footnote is its own greyed final block",
      !!scr.querySelector('.output-doc__footnote') &&
      /sinaida\.eu/.test(scr.querySelector('.output-doc__footnote').textContent));

    const bad = results.filter((r) => !r[1]);
    const summary = document.querySelector('[data-role="summary"]');
    summary.textContent = bad.length
      ? "FAIL: " + bad.map((r) => r[0]).join(", ")
      : "OK — all " + results.length + " renders passed";
    summary.className = "status " + (bad.length ? "bad" : "ok");
  </script>
</body>
</html>
